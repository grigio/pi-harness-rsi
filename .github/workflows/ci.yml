name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --frozen-lockfile
      # One command, identical to the local finish gate (`AGENTS.md`): typecheck,
      # lint and test in order, so CI and the documented workflow cannot drift.
      - name: Gate
        run: bun run check
